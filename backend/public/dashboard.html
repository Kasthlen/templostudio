<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin - TemploStudio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0D0B0A;
            color: #F5EBDD;
            min-height: 100vh;
        }

        .navbar {
            background: #8F2432;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h1 {
            font-size: 1.5rem;
            color: #D4AF66;
        }

        .logout-btn {
            background: #D4AF66;
            color: #100E0D;
            border: none;
            padding: 0.5rem 1.5rem;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
        }

        .logout-btn:hover {
            background: #B23440;
            color: white;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: #15110F;
            border: 1px solid #4D3928;
            border-radius: 12px;
            padding: 1.5rem;
        }

        .stat-card h3 {
            color: #D4AF66;
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
        }

        .stat-card .value {
            font-size: 2.5rem;
            font-weight: 600;
        }

        .appointments-table {
            background: #15110F;
            border: 1px solid #4D3928;
            border-radius: 12px;
            overflow: hidden;
        }

        .table-header {
            background: #70202B;
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .table-header h2 {
            color: #D4AF66;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 1rem 1.5rem;
            text-align: left;
            border-bottom: 1px solid #4D3928;
        }

        th {
            background: #17120F;
            color: #D4AF66;
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        tr:hover {
            background: #17120F;
        }

        .status {
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status.pendiente {
            background: #D4AF66;
            color: #100E0D;
        }

        .status.confirmada {
            background: #22c55e;
            color: white;
        }

        .status.completada {
            background: #3b82f6;
            color: white;
        }

        .status.cancelada {
            background: #ef4444;
            color: white;
        }

        .actions {
            display: flex;
            gap: 0.5rem;
        }

        .action-btn {
            padding: 0.4rem 0.8rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .btn-confirm {
            background: #22c55e;
            color: white;
        }

        .btn-complete {
            background: #3b82f6;
            color: white;
        }

        .btn-cancel {
            background: #ef4444;
            color: white;
        }

        .btn-delete {
            background: #70202B;
            color: white;
        }

        .action-btn:hover {
            opacity: 0.8;
        }

        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #0D0B0A;
        }

        .login-box {
            background: #15110F;
            border: 1px solid #4D3928;
            border-radius: 16px;
            padding: 2.5rem;
            width: 100%;
            max-width: 400px;
        }

        .login-box h1 {
            color: #D4AF66;
            text-align: center;
            margin-bottom: 2rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #BFB19D;
            font-size: 0.9rem;
        }

        .form-group input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #4D3928;
            border-radius: 8px;
            background: #0D0B0A;
            color: #F5EBDD;
            font-size: 1rem;
        }

        .form-group input:focus {
            outline: none;
            border-color: #D4AF66;
        }

        .login-btn {
            width: 100%;
            padding: 0.75rem;
            background: #8F2432;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #B23440;
        }

        .error {
            color: #ef4444;
            font-size: 0.9rem;
            margin-top: 1rem;
            text-align: center;
        }

        .hidden {
            display: none;
        }

        .loading {
            text-align: center;
            padding: 2rem;
            color: #D4AF66;
        }

        .nav-actions {
            display: flex;
            gap: 0.75rem;
        }

        .secondary-btn {
            background: transparent;
            color: #D4AF66;
            border: 1px solid #D4AF66;
        }

        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
            z-index: 10;
        }

        .modal.hidden {
            display: none;
        }

        .modal .login-box h2 {
            color: #D4AF66;
            margin-bottom: 1.5rem;
        }

        .modal-actions {
            display: flex;
            gap: 0.75rem;
        }

        .modal-actions .login-btn {
            flex: 1;
        }

        .success {
            color: #22c55e;
            font-size: 0.9rem;
            margin-top: 1rem;
            text-align: center;
        }

        @media (max-width: 600px) {
            .navbar {
                flex-direction: column;
                gap: 0.75rem;
            }

            .appointments-table {
                overflow-x: auto;
            }
        }
    </style>
</head>
<body>
    <!-- Login Form -->
    <div id="loginForm" class="login-container">
        <div class="login-box">
            <h1>🏛️ TemploStudio Admin</h1>
            <form id="loginFormElement">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" required>
                </div>
                <div class="form-group">
                    <label>Contraseña</label>
                    <input type="password" id="password" required>
                </div>
                <button type="submit" class="login-btn">Iniciar Sesión</button>
                <div id="loginError" class="error hidden"></div>
            </form>
        </div>
    </div>

    <!-- Dashboard -->
    <div id="dashboard" class="hidden">
        <nav class="navbar">
            <h1>🏛️ TemploStudio Dashboard</h1>
            <div class="nav-actions">
                <button class="logout-btn secondary-btn" onclick="openPasswordModal()">Cambiar contraseña</button>
                <button class="logout-btn" onclick="logout()">Cerrar Sesión</button>
            </div>
        </nav>

        <!-- Cambiar contraseña -->
        <div id="passwordModal" class="modal hidden">
            <div class="login-box">
                <h2>Cambiar contraseña</h2>
                <form id="passwordForm">
                    <div class="form-group">
                        <label for="currentPassword">Contraseña actual</label>
                        <input type="password" id="currentPassword" autocomplete="current-password" required>
                    </div>
                    <div class="form-group">
                        <label for="newPassword">Nueva contraseña (mínimo 10 caracteres)</label>
                        <input type="password" id="newPassword" autocomplete="new-password" minlength="10" required>
                    </div>
                    <div class="form-group">
                        <label for="confirmPassword">Repite la nueva contraseña</label>
                        <input type="password" id="confirmPassword" autocomplete="new-password" minlength="10" required>
                    </div>
                    <div class="modal-actions">
                        <button type="button" class="login-btn secondary-btn" onclick="closePasswordModal()">Cancelar</button>
                        <button type="submit" class="login-btn">Guardar</button>
                    </div>
                    <div id="passwordError" class="error hidden"></div>
                    <div id="passwordSuccess" class="success hidden"></div>
                </form>
            </div>
        </div>

        <div class="container">
            <div class="stats">
                <div class="stat-card">
                    <h3>Total Citas</h3>
                    <div class="value" id="totalAppointments">0</div>
                </div>
                <div class="stat-card">
                    <h3>Pendientes</h3>
                    <div class="value" id="pendingAppointments">0</div>
                </div>
                <div class="stat-card">
                    <h3>Confirmadas</h3>
                    <div class="value" id="confirmedAppointments">0</div>
                </div>
                <div class="stat-card">
                    <h3>Completadas</h3>
                    <div class="value" id="completedAppointments">0</div>
                </div>
            </div>

            <div class="appointments-table">
                <div class="table-header">
                    <h2>Citas Agendadas</h2>
                </div>
                <div id="loading" class="loading">Cargando citas...</div>
                <table id="appointmentsTable" class="hidden">
                    <thead>
                        <tr>
                            <th>Cliente</th>
                            <th>Servicio</th>
                            <th>Fecha</th>
                            <th>Hora</th>
                            <th>Teléfono</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="appointmentsBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const API_URL = '/api';
        let token = localStorage.getItem('token');

        // Check if user is logged in
        if (token) {
            showDashboard();
        }

        // Login
        document.getElementById('loginFormElement').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (data.success) {
                    token = data.token;
                    localStorage.setItem('token', token);
                    showDashboard();
                } else {
                    document.getElementById('loginError').textContent = data.message;
                    document.getElementById('loginError').classList.remove('hidden');
                }
            } catch (error) {
                document.getElementById('loginError').textContent = 'Error al conectar con el servidor';
                document.getElementById('loginError').classList.remove('hidden');
            }
        });

        function showDashboard() {
            document.getElementById('loginError').classList.add('hidden');
            document.getElementById('loading').textContent = 'Cargando citas...';
            document.getElementById('loading').classList.remove('hidden');
            document.getElementById('loginForm').classList.add('hidden');
            document.getElementById('dashboard').classList.remove('hidden');
            loadAppointments();
        }

        function logout() {
            localStorage.removeItem('token');
            token = null;
            document.getElementById('dashboard').classList.add('hidden');
            document.getElementById('loginForm').classList.remove('hidden');
        }

        // Los datos de las citas vienen de un formulario público: se escapan
        // antes de insertarlos en el HTML para evitar XSS en el dashboard.
        function escapeHTML(value) {
            return String(value ?? '').replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[c]));
        }

        // Sesión expirada o usuario sin permisos: volver al login con un aviso
        function handleAuthError(response) {
            if (response.status === 401 || response.status === 403) {
                logout();
                const loginError = document.getElementById('loginError');
                loginError.textContent = response.status === 401
                    ? 'Tu sesión ha expirado, inicia sesión de nuevo'
                    : 'Esta cuenta no tiene acceso al dashboard';
                loginError.classList.remove('hidden');
                return true;
            }
            return false;
        }

        async function loadAppointments() {
            try {
                const response = await fetch(`${API_URL}/appointments`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (handleAuthError(response)) return;
                const data = await response.json();

                if (data.success) {
                    displayAppointments(data.data);
                } else {
                    document.getElementById('loading').textContent = 'Error cargando citas: ' + data.message;
                }
            } catch (error) {
                console.error('Error loading appointments:', error);
                document.getElementById('loading').textContent = 'Error al conectar con el servidor';
            }
        }

        function openPasswordModal() {
            document.getElementById('passwordForm').reset();
            document.getElementById('passwordError').classList.add('hidden');
            document.getElementById('passwordSuccess').classList.add('hidden');
            document.getElementById('passwordModal').classList.remove('hidden');
            document.getElementById('currentPassword').focus();
        }

        function closePasswordModal() {
            document.getElementById('passwordModal').classList.add('hidden');
        }

        document.getElementById('passwordForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errorBox = document.getElementById('passwordError');
            const successBox = document.getElementById('passwordSuccess');
            const showError = (msg) => {
                successBox.classList.add('hidden');
                errorBox.textContent = msg;
                errorBox.classList.remove('hidden');
            };

            const currentPassword = document.getElementById('currentPassword').value;
            const newPassword = document.getElementById('newPassword').value;
            if (newPassword !== document.getElementById('confirmPassword').value) {
                return showError('Las contraseñas nuevas no coinciden');
            }

            try {
                const response = await fetch(`${API_URL}/auth/password`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ currentPassword, newPassword })
                });
                const data = await response.json();

                if (data.success) {
                    errorBox.classList.add('hidden');
                    document.getElementById('passwordForm').reset();
                    successBox.textContent = 'Contraseña actualizada. Úsala la próxima vez que inicies sesión.';
                    successBox.classList.remove('hidden');
                    setTimeout(closePasswordModal, 2500);
                } else {
                    showError(data.message);
                }
            } catch (error) {
                showError('Error al conectar con el servidor');
            }
        });

        function displayAppointments(appointments) {
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('appointmentsTable').classList.remove('hidden');

            const tbody = document.getElementById('appointmentsBody');
            tbody.innerHTML = '';

            // Update stats
            const stats = {
                total: appointments.length,
                pendiente: appointments.filter(a => a.status === 'pendiente').length,
                confirmada: appointments.filter(a => a.status === 'confirmada').length,
                completada: appointments.filter(a => a.status === 'completada').length
            };

            document.getElementById('totalAppointments').textContent = stats.total;
            document.getElementById('pendingAppointments').textContent = stats.pendiente;
            document.getElementById('confirmedAppointments').textContent = stats.confirmada;
            document.getElementById('completedAppointments').textContent = stats.completada;

            appointments.forEach(appointment => {
                const id = escapeHTML(appointment._id);
                const status = escapeHTML(appointment.status);
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>
                        <strong>${escapeHTML(appointment.clientName)}</strong><br>
                        <small>${escapeHTML(appointment.clientEmail)}</small>
                    </td>
                    <td>${escapeHTML(appointment.service)}</td>
                    <td>${new Date(appointment.date).toLocaleDateString('es-ES', { timeZone: 'UTC' })}</td>
                    <td>${escapeHTML(appointment.time)}</td>
                    <td>${escapeHTML(appointment.clientPhone)}</td>
                    <td><span class="status ${status}">${status}</span></td>
                    <td>
                        <div class="actions">
                            ${appointment.status === 'pendiente' ? `
                                <button class="action-btn btn-confirm" onclick="updateStatus('${id}', 'confirmada')">✓</button>
                            ` : ''}
                            ${appointment.status === 'confirmada' ? `
                                <button class="action-btn btn-complete" onclick="updateStatus('${id}', 'completada')">✓</button>
                            ` : ''}
                            ${appointment.status !== 'cancelada' ? `
                                <button class="action-btn btn-cancel" onclick="updateStatus('${id}', 'cancelada')">✗</button>
                            ` : ''}
                            <button class="action-btn btn-delete" onclick="deleteAppointment('${id}')">🗑</button>
                        </div>
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        async function updateStatus(id, status) {
            try {
                const response = await fetch(`${API_URL}/appointments/${id}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ status })
                });

                const data = await response.json();

                if (data.success) {
                    loadAppointments();
                }
            } catch (error) {
                console.error('Error updating appointment:', error);
            }
        }

        async function deleteAppointment(id) {
            if (!confirm('¿Estás seguro de eliminar esta cita?')) return;

            try {
                const response = await fetch(`${API_URL}/appointments/${id}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                const data = await response.json();

                if (data.success) {
                    loadAppointments();
                }
            } catch (error) {
                console.error('Error deleting appointment:', error);
            }
        }
    </script>
</body>
</html>
