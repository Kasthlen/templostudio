services:
  - type: web
    name: templostudio
    env: node
    plan: free
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false # Configurar en el dashboard de Render
      - key: JWT_SECRET
        sync: false # Configurar en el dashboard de Render
      # Render free bloquea SMTP: el envío real va por HTTPS (ver backend/apps-script/Code.gs)
      - key: EMAIL_WEBHOOK_URL
        sync: false # URL /exec de la app web de Google Apps Script
      - key: EMAIL_WEBHOOK_SECRET
        sync: false # Mismo valor que SECRET en Code.gs
      - key: BREVO_API_KEY
        sync: false # Alternativa opcional a Apps Script
      - key: ADMIN_NOTIFY_EMAIL
        sync: false # Correo que recibe los avisos de nuevas citas
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: 587
      - key: EMAIL_USER
        sync: false # Configurar en el dashboard de Render
      - key: EMAIL_PASSWORD
        sync: false # Configurar en el dashboard de Render
      - key: EMAIL_FROM
        sync: false # Configurar en el dashboard de Render
      - key: ADMIN_EMAIL
        sync: false # Configurar en el dashboard de Render
      - key: ADMIN_PASSWORD
        sync: false # Configurar en el dashboard de Render
      - key: FRONTEND_URL
        value: https://templostudio.onrender.com
